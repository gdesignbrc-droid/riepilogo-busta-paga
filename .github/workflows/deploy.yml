name: Pubblica su GitHub Pages

# Si attiva a ogni modifica caricata sul ramo principale, e si può lanciare
# a mano dalla scheda Actions del repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi necessari alla pubblicazione.
permissions:
  contents: read
  pages: write
  id-token: write

# Se arrivano due modifiche ravvicinate, pubblica solo la più recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci richiede package-lock.json: se non è ancora stato committato,
      # si ripiega su npm install.
      - name: Installa le dipendenze
        run: npm ci || npm install

      #- name: Controlli automatici
      #  run: npm test

      # Il sito vive in https://<utente>.github.io/<repository>/, quindi il
      # base href deve contenere il nome del repository, altrimenti il browser
      # cerca gli asset nella radice del dominio e non li trova.
      - name: Compila
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
